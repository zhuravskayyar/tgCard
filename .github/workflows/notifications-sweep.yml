# Calls the notification sweep (docs/notifications.md). GitHub runs schedules at best every 5 minutes,
# sometimes later under load. CRON_SECRET must match the Vercel environment variable.
name: Notification sweep

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: notification-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run sweep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://app.cardastika.org/api/internal/notifications/sweep
